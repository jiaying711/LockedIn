<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Profile</title>
    <link rel="icon" type="image/jpg" href="/images/mango_icon.png"/>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link rel="stylesheet" href="/stylesheets/profile.css">
    <script src="/javascripts/index.js"></script>
</head>

<body>
    <div class="profile-container">
        <!-- MAIN CONTENT WITH 2 COLUMNS -->
        <div class="profile-content">
            <!-- LEFT SIDE: USER DETAILS -->
            <div class="profile-left">
                <div class="profile-header">
                    <h1>My Details</h1>
                    <div class="profile-picture-container">
                        <img id="profilePicture" class="profile-picture" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Profile Picture">
                        <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
                    </div>
                </div>

                <form id="profileForm">
                    <!-- Hidden file input for form submission -->
                    <input type="file" name="avatar" id="avatarFormInput" style="display: none;" accept="image/*">

                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="currentPassword">Current Password:</label>
                        <input type="password" id="currentPassword" name="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password (leave blank to keep current):</label>
                        <input type="password" id="newPassword" name="newPassword">
                    </div>
                    <button type="submit" class="update-btn">Update Profile</button>
                </form>
            </div>

            <!-- RIGHT SIDE: ACHIEVEMENTS -->
            <div class="profile-right">
                <div class="achievements-section">
                    <h2>My Achievements</h2>
                    <div class="achievement-list">
                        <div class="loading">Loading achievements...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM SIDE: NAVIGATION TOOLS -->
        <div class="navigation">
            <a href="/">← Back to Home</a>
            <a href="#" id="logoutLink">Logout →</a>
        </div>

    </div>
    <script src="/javascripts/profile.js"></script>
</body>
</html>
